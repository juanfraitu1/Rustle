# External tools for the pipeline and the bench scripts. The Rust crate itself builds with the
# rustup toolchain (`cargo`), not from here. Environments are detached (outside the repository):
#   pixi config set --global detached-environments true
[workspace]
name = "rustle"
channels = ["conda-forge", "bioconda"]
platforms = ["linux-64"]

[dependencies]
# the shipped read mapping is minimap2 2.30 (docs/DATA.md; HG002 and sim.py use the same settings)
minimap2 = "==2.30"
samtools = "==1.22.1"
mmseqs2 = "*"           # src/: one Command::new("mmseqs")
python = "3.12.*"
pysam = "*"
numpy = "*"
scipy = "*"
matplotlib = "*"
ncbi-datasets-cli = "*" # genomes and annotations from NCBI
gffread = "*"
seqkit = "*"
pigz = "*"
htslib = "*"            # bgzip, tabix
pytest = ">=9.1.1,<10"
miniprot = ">=0.18,<0.19"

[feature.bench.dependencies]
# baselines and comparators used by bench/ and figures/ (not needed by the pipeline)
gffcompare = "*"
liftoff = "*"
stringtie = "*"
# bench/unmapped_rescue and bench/o3_maternal: attribution, profiles, consensus, kmerhit.c
blast = "*"
hmmer = "==3.4"
mafft = "*"
pyabpoa = "*"
python-edlib = "*"
c-compiler = "*"

[environments]
bench = ["bench"]
graph = { features = ["graph"], no-default-feature = true }
isocon = { features = ["isocon"], no-default-feature = true }
flair = { features = ["flair"], no-default-feature = true }
sqanti3 = { features = ["sqanti3"], no-default-feature = true }

[tasks]
build = "CARGO_TARGET_DIR=${CARGO_TARGET_DIR:-$HOME/rustle_target} cargo build --release --bins -j 4 > build.log 2>&1"
test = "CARGO_TARGET_DIR=${CARGO_TARGET_DIR:-$HOME/rustle_target} cargo test --release -j 4 > test.log 2>&1"
test-fast = "CARGO_TARGET_DIR=${CARGO_TARGET_DIR:-$HOME/rustle_target} cargo test --profile dev-opt -j 4 > test.log 2>&1"
# the exon-gated minimap2 the families stage uses (docs/archive/2026-10/merged/O1_FAST_2026-10-21.md); installs $CONDA_PREFIX/bin/minimap2-gate
build-minimap2-gate = "bash tools/minimap2_gate/build.sh $CONDA_PREFIX/bin"

[feature.isocon.dependencies]
# IsoCon (Sahlin et al. 2018), the reconstruction comparator; not on bioconda, so from PyPI. Its own python (old code).
python = "3.8.*"
pysam = "*"
networkx = "<=2.3"
edlib = "*"
parasail-python = "*"
numpy = "<1.20"
minimap2 = "==2.30"

[feature.isocon.pypi-dependencies]
IsoCon = "==0.3.3"

[feature.flair.dependencies]
# FLAIR 3.0.0, the comparator in REPRODUCE.md. Own environment so it cannot shadow anything else (§6q6).
flair = "==3.0.0"
bedtools = "*"
minimap2 = "==2.30"
samtools = "==1.22.1"

[feature.sqanti3.dependencies]
# SQANTI3 classification and isoseq collapse; kept apart from FLAIR (their numpy pins conflict).
sqanti3 = "*"
isoseq = "*"
minimap2 = "==2.30"

[feature.graph.dependencies]
# family variation graphs (thesis model, LEDGER_GENERAL §18): vg msga / vg rna, GraphAligner, odgi for stats and layout
vg = "*"              # vg msga is gone in v1.76; graphs are induced with seqwish (minimap2 all-vs-all) or minigraph
graphaligner = "*"
odgi = "*"
seqwish = "*"
minigraph = "*"
gfatools = "*"
minimap2 = "==2.30"
samtools = "*"
python = "3.12.*"
