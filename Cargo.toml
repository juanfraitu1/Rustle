[package]
name = "rustle"
version = "0.1.0"
edition = "2021"
autobins = false

[lib]
path = "src/rustle/lib.rs"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
anyhow = "1.0"

# BAM/SAM/CRAM parsing - pure Rust, no system dependencies. The cram + fasta features
# come from the SAME noodles 0.85 group as noodles-sam 0.66, so RecordBuf types unify
# across all three input formats (native SAM/BAM/CRAM via one RecordBuf pipeline).
noodles = { version = "0.85", features = ["bam", "sam", "cram", "fasta"] }
noodles-bam = "0.70"
noodles-bgzf = "0.33"
noodles-sam = "0.66"
noodles-csi = "0.40"
noodles-core = "0.15"

# REMOVED 2026-08-09, all three declared but referenced NOWHERE in src/ or tests/ (verified by grep,
# including behind cfg): `hashbrown` (the "fast hashmap" was never adopted — the tree uses std maps via
# types::DetHashMap), `memmap2` (no memory-mapped I/O exists), `roaring` (no bitset junction matching
# exists; the one bitset in the tree is util/bitset.rs on `fixedbitset`). They linked nothing, so removing
# them changes no behaviour and costs no runtime — it only stops compiling them, and with lto=fat +
# codegen-units=1 on this box that is real build time on every clean build.
fixedbitset = "0.5" # util/bitset.rs

# Fast hashing (used in types.rs / junction_set.rs)
fxhash = "0.2"

# Parallel processing
rayon = "1.10"

lru = "0.12" # src/bin/copy_assign.rs contig cache

# Random sampling for rarefaction analysis
rand = "0.8"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0"
poasta = "0.1.0"

[profile.release]
opt-level = 3
lto = "fat"       # Full LTO for maximum runtime speed
codegen-units = 1 # Single codegen unit for best optimization
panic = "abort"

[profile.dev-opt]   # Fast compile, decent runtime
inherits = "release"
lto = false
codegen-units = 16
opt-level = 2

[profile.release-with-debug]
inherits = "release"
debug = true

[profile.quick]     # Fastest build for development iteration
inherits = "dev"
opt-level = 0       # No optimization at all
debug = true
debug-assertions = true
overflow-checks = true
lto = false
codegen-units = 256 # Maximum parallelism
panic = "unwind"

[[bin]]
name = "mcl_families"
path = "src/bin/mcl_families.rs"

[[bin]]
name = "gamma_refine"
path = "src/bin/gamma_refine.rs"

[[bin]]
name = "debug_poa"
path = "src/bin/debug_poa.rs"

[[bin]]
name = "bam_header"
path = "src/bin/bam_header.rs"

[[bin]]
name = "filter_bam_by_as"
path = "src/bin/filter_bam_by_as.rs"

[[bin]]
name = "index_bam"
path = "src/bin/index_bam.rs"

[[bin]]
name = "copy_assign"
path = "src/bin/copy_assign.rs"

[[bin]]
name = "gw_family_catalog"
path = "src/bin/gw_family_catalog.rs"

[[bin]]
name = "asj"
path = "src/bin/asj.rs"

[[bin]]
name = "asj_verify"
path = "src/bin/asj_verify.rs"

[[bin]]
name = "family_define"
path = "src/bin/family_define.rs"

[[bin]]
name = "parcn"
path = "src/bin/parcn.rs"

[[test]]
name = "vg_family_family_graph"
path = "tests/regression/vg_family_family_graph.rs"

[[test]]
name = "vg_family_diagnostic"
path = "tests/regression/vg_family_diagnostic.rs"

[dev-dependencies]
tempfile = "3"
