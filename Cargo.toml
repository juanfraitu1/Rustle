[package]
name = "rustle"
version = "0.1.0"
edition = "2021"
autobins = false

[lib]
path = "src/rustle/lib.rs"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
anyhow = "1.0"

# BAM parsing - pure Rust, no system dependencies.
noodles-bam = "0.70"
noodles-bgzf = "0.33"
noodles-sam = "0.66"
noodles-csi = "0.40"
noodles-core = "0.15"

# REMOVED 2026-08-09, declared but referenced NOWHERE in src/ or tests/: `hashbrown`, `memmap2`, `roaring`.
# REMOVED 2026-09-24 for the same reason: `fixedbitset` (util/bitset.rs went 2026-09-20), `rand`, `serde`, and
# the umbrella `noodles` crate with its cram/fasta features (only the dead SAM/CRAM transcoder in bam.rs used
# it). `serde_json` is test-only now (dev-dependency). Removing them changes no behaviour and costs no runtime;
# with lto=fat + codegen-units=1 it only stops compiling them.

# Fast deterministic hashing (types.rs: DetHashMap / DetHashSet)
fxhash = "0.2"

# Parallel processing
rayon = "1.10"

lru = "0.12" # src/bin/copy_assign.rs contig cache

flate2 = "1.1" # src/bin/gff_to_gtf.rs — plain .gz GFF3 input (bgzf is noodles' job)
poasta = "0.1.0"

[profile.release]
opt-level = 3
lto = "fat"       # Full LTO for maximum runtime speed
codegen-units = 1 # Single codegen unit for best optimization
panic = "abort"

[profile.dev-opt]   # Fast compile, decent runtime
inherits = "release"
lto = false
codegen-units = 16
opt-level = 2

[profile.release-with-debug]
inherits = "release"
debug = true

[profile.quick]     # Fastest build for development iteration
inherits = "dev"
opt-level = 0       # No optimization at all
debug = true
debug-assertions = true
overflow-checks = true
lto = false
codegen-units = 256 # Maximum parallelism
panic = "unwind"

[[bin]]
name = "mcl_families"
path = "src/bin/mcl_families.rs"







[[bin]]
name = "copy_assign"
path = "src/bin/copy_assign.rs"

[[bin]]
name = "gw_family_catalog"
path = "src/bin/gw_family_catalog.rs"




[[bin]]
name = "parcn"
path = "src/bin/parcn.rs"


[dev-dependencies]
tempfile = "3"
serde_json = "1.0" # test fixtures (seq_utils aln_id parity, genome IndexedFasta vs pysam)

[[bin]]
name = "gff_to_gtf"
path = "src/bin/gff_to_gtf.rs"

[[bin]]
name = "locus_bed"
path = "src/bin/locus_bed.rs"

[[bin]]
name = "readthrough_filter"
path = "src/bin/readthrough_filter.rs"

[[bin]]
name = "family_score"
path = "src/bin/family_score.rs"


[[bin]]
name = "mcl_port"
path = "src/bin/mcl_port.rs"

[[bin]]
name = "missing_copy_flag"
path = "src/bin/missing_copy_flag.rs"

[[bin]]
name = "as_table"
path = "src/bin/as_table.rs"
