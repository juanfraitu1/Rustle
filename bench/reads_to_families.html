<title>From reads to families</title>
<style>
:root{
  --bg:#eef1f4;--surface:#ffffff;--ink:#151d27;--muted:#5f6b79;--hair:#dde3ea;--spine:#aab2bd;--axis:#c3cad3;
  --c0:#d1434f;--c1:#2c7fc0;--c2:#3a9866;--amber:#c98a1a;--read:#8b96a4;--no:#cd4a44;
  --mono:ui-monospace,"SF Mono","JetBrains Mono","Cascadia Code",Menlo,Consolas,monospace;
  --sans:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --shadow:0 1px 2px rgba(20,30,45,.06),0 6px 22px rgba(20,30,45,.05);
}
@media (prefers-color-scheme:dark){:root{
  --bg:#0d121a;--surface:#141b25;--ink:#e6ecf4;--muted:#8593a3;--hair:#232f3c;--spine:#3c4756;--axis:#33404e;
  --c0:#e06974;--c1:#4c9bd8;--c2:#54b585;--amber:#dCa73e;--read:#5c6a7a;--no:#e0776b;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 26px rgba(0,0,0,.28);
}}
:root[data-theme="light"]{--bg:#eef1f4;--surface:#ffffff;--ink:#151d27;--muted:#5f6b79;--hair:#dde3ea;--spine:#aab2bd;--axis:#c3cad3;--c0:#d1434f;--c1:#2c7fc0;--c2:#3a9866;--amber:#c98a1a;--read:#8b96a4;--no:#cd4a44;--shadow:0 1px 2px rgba(20,30,45,.06),0 6px 22px rgba(20,30,45,.05);}
:root[data-theme="dark"]{--bg:#0d121a;--surface:#141b25;--ink:#e6ecf4;--muted:#8593a3;--hair:#232f3c;--spine:#3c4756;--axis:#33404e;--c0:#e06974;--c1:#4c9bd8;--c2:#54b585;--amber:#dCa73e;--read:#5c6a7a;--no:#e0776b;--shadow:0 1px 2px rgba(0,0,0,.3),0 8px 26px rgba(0,0,0,.28);}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);line-height:1.5;-webkit-font-smoothing:antialiased;padding:clamp(14px,3vw,34px)}
.wrap{max-width:1000px;margin:0 auto}
.eyebrow{font-family:var(--mono);font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
h1{font-family:var(--mono);font-weight:600;font-size:clamp(24px,4vw,36px);letter-spacing:-.01em;margin:.12em 0 .1em;text-wrap:balance}
.sub{color:var(--muted);max-width:70ch;margin:.2em 0 0;font-size:15px}

.steps{display:flex;gap:0;margin:24px 0 14px;background:var(--surface);border:1px solid var(--hair);border-radius:12px;overflow:hidden;box-shadow:var(--shadow)}
.steps button{flex:1;background:none;border:none;border-right:1px solid var(--hair);padding:12px 8px;cursor:pointer;font-family:var(--mono);color:var(--muted);transition:background .2s,color .2s;text-align:center}
.steps button:last-child{border-right:none}
.steps button .n{display:block;font-size:10.5px;letter-spacing:.1em}
.steps button .t{display:block;font-size:13.5px;font-weight:600;margin-top:2px}
.steps button.on{color:var(--ink);background:color-mix(in srgb,var(--amber) 12%,transparent)}
.steps button.on .t{color:var(--amber)}
.steps button:hover:not(.on){background:color-mix(in srgb,var(--muted) 8%,transparent)}

.stagecard{background:var(--surface);border:1px solid var(--hair);border-radius:12px;box-shadow:var(--shadow);padding:12px 14px 6px}
svg.stage{width:100%;height:auto;display:block}
/* step-driven visibility */
.stage .reads{transition:opacity .5s}
.stage .node,.stage .conn{transition:opacity .45s}
.stage .edge,.stage .hull,.stage .elabel{transition:opacity .45s}
.stage .node circle,.stage .node .halo{transition:fill .5s,stroke .5s}
.stage[data-step="0"] .node,.stage[data-step="0"] .conn{opacity:.12}
.stage[data-step="0"] .edge,.stage[data-step="0"] .hull,.stage[data-step="0"] .elabel{opacity:0}
.stage[data-step="1"] .reads{opacity:.1}
.stage[data-step="1"] .edge,.stage[data-step="1"] .hull,.stage[data-step="1"] .elabel{opacity:0}
.stage[data-step="2"] .reads{opacity:.07}
.stage[data-step="2"] .hull{opacity:0}
.stage[data-step="3"] .reads{opacity:.05}
/* family colouring only at step 3 */
.stage[data-step="3"] .node.gstm circle{fill:var(--c0)}
.stage[data-step="3"] .node.gstm text{fill:#fff}
.stage[data-step="3"] .edge.fam{stroke:var(--c0);stroke-opacity:.9}

.ctrls{display:flex;justify-content:space-between;align-items:center;margin-top:10px}
.ctrls button{font-family:var(--mono);font-size:13px;background:var(--surface);border:1px solid var(--hair);border-radius:8px;padding:8px 16px;cursor:pointer;color:var(--ink)}
.ctrls button[disabled]{opacity:.4;cursor:default}
.dots{display:flex;gap:7px}.dots i{width:8px;height:8px;border-radius:50%;background:var(--hair)}.dots i.on{background:var(--amber)}

.caption{background:var(--surface);border:1px solid var(--hair);border-radius:12px;box-shadow:var(--shadow);padding:16px 18px;margin-top:14px;min-height:118px}
.caption h2{font-family:var(--mono);font-size:12px;letter-spacing:.08em;text-transform:uppercase;margin:0 0 6px;color:var(--amber)}
.caption p{margin:0 0 8px;font-size:14.5px}
.caption .num{font-family:var(--mono);font-size:12.5px;color:var(--muted)}
.caption .num b{color:var(--ink)}
.foot{margin-top:16px;color:var(--muted);font-size:12.5px;font-family:var(--mono)}
.foot a{color:var(--amber)}
a.themebtn{position:fixed;top:12px;right:14px;font-family:var(--mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);background:var(--surface);border:1px solid var(--hair);border-radius:999px;padding:6px 12px;cursor:pointer;z-index:5}
:focus-visible{outline:2.5px solid var(--amber);outline-offset:2px;border-radius:6px}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<a class="themebtn" id="themebtn">◑ theme</a>
<div class="wrap">
  <div class="eyebrow">Multi-copy gene families · O1, end to end</div>
  <h1>From reads to families</h1>
  <p class="sub">The hard leap: a pile of <b>reads</b> (molecules) becomes a <b>graph of families</b>. Four steps,
     no annotation used — reads → de-novo loci → homology edges → dense clusters. Step through it.</p>

  <div class="steps" id="steps">
    <button data-s="0"><span class="n">STEP 1</span><span class="t">Reads</span></button>
    <button data-s="1"><span class="n">STEP 2</span><span class="t">Loci</span></button>
    <button data-s="2"><span class="n">STEP 3</span><span class="t">Homology</span></button>
    <button data-s="3"><span class="n">STEP 4</span><span class="t">Families</span></button>
  </div>

  <div class="stagecard">
    <svg id="stage" class="stage" viewBox="0 0 700 300" data-step="0" role="img" aria-label="reads to families derivation"></svg>
  </div>
  <div class="ctrls">
    <button id="prev">‹ back</button>
    <div class="dots" id="dots"></div>
    <button id="next">next ›</button>
  </div>

  <div class="caption" id="caption"></div>
  <div class="foot" id="foot"></div>
</div>

<script>
const $=id=>document.getElementById(id), NS='http://www.w3.org/2000/svg';
const mk=(t,a={})=>{const e=document.createElementNS(NS,t);for(const k in a)e.setAttribute(k,a[k]);return e;};

/* loci along a genome axis (schematic x; GSTM cluster is a real tandem array) */
const AX=104, NY=210;
const LOCI=[
  {id:'SG',   x:96,  label:'SG',    kind:'single', reads:'1 gene'},
  {id:'DOM1', x:206, label:'DOM1',  kind:'dom',    reads:'1 gene'},
  {id:'GSTM3',x:346, label:'GSTM3', kind:'gstm',   reads:'187'},
  {id:'GSTM5',x:396, label:'GSTM5', kind:'gstm',   reads:'≈900'},
  {id:'GSTM1',x:446, label:'GSTM1', kind:'gstm',   reads:'≈1600'},
  {id:'DOM2', x:612, label:'DOM2',  kind:'dom',    reads:'1 gene'},
];
const byId=Object.fromEntries(LOCI.map(l=>[l.id,l]));
const FAM_EDGES=[['GSTM3','GSTM5','≈80%'],['GSTM5','GSTM1','83%'],['GSTM3','GSTM1','≈80%']];
const REJECT=[['DOM1','DOM2','22% aligned · no edge']];

function build(){
  const svg=$('stage'); svg.innerHTML='';
  // genome axis
  svg.appendChild(mk('line',{x1:40,y1:AX,x2:660,y2:AX,stroke:'var(--axis)','stroke-width':2}));
  const axlab=mk('text',{x:40,y:AX-8,fill:'var(--muted)','font-family':'var(--mono)','font-size':'10'});axlab.textContent='genome';svg.appendChild(axlab);
  [['GSTM3–GSTM1 tandem array (chr1)',396,AX+18]].forEach(([t,x,y])=>{const e=mk('text',{x,y,'text-anchor':'middle',fill:'var(--muted)','font-family':'var(--mono)','font-size':'9'});e.textContent=t;svg.appendChild(e);});

  // read pileups (step 1)
  LOCI.forEach(l=>{
    const g=mk('g',{class:'reads'});
    const n=l.kind==='gstm'?7:5;
    for(let i=0;i<n;i++){
      const w=l.kind==='gstm'?34:26, y=AX-10-i*7.5;
      g.appendChild(mk('line',{x1:l.x-w/2,y1:y,x2:l.x+w/2,y2:y,stroke:'var(--read)','stroke-width':3,'stroke-linecap':'round','stroke-opacity':.75}));
    }
    svg.appendChild(g);
  });

  // connectors axis→node (step 2+)
  LOCI.forEach(l=>svg.appendChild(mk('line',{class:'conn',x1:l.x,y1:AX+2,x2:l.x,y2:NY-16,stroke:'var(--hair)','stroke-width':1,'stroke-dasharray':'2 3'})));

  // family hull (step 4)
  const gx=[byId.GSTM3.x,byId.GSTM5.x,byId.GSTM1.x];
  svg.appendChild(mk('path',{class:'hull',d:`M ${gx[0]-30} ${NY} Q ${gx[1]} ${NY+56} ${gx[2]+30} ${NY} Q ${gx[1]} ${NY-42} ${gx[0]-30} ${NY} Z`,
    fill:'color-mix(in srgb,var(--c0) 9%,transparent)',stroke:'var(--c0)','stroke-dasharray':'5 4','stroke-width':1.4,'stroke-opacity':.7}));

  // edges (step 3+)
  const arc=(a,b,dip)=>`M ${a.x} ${NY} Q ${(a.x+b.x)/2} ${NY+dip} ${b.x} ${NY}`;
  FAM_EDGES.forEach(([a,b])=>{const A=byId[a],B=byId[b],dip=22+Math.abs(A.x-B.x)*0.12;
    svg.appendChild(mk('path',{class:'edge fam',d:arc(A,B,dip),fill:'none',stroke:'var(--spine)','stroke-width':2.4}));});
  REJECT.forEach(([a,b,lab])=>{const A=byId[a],B=byId[b],mx=(A.x+B.x)/2;
    svg.appendChild(mk('path',{class:'edge',d:arc(A,B,64),fill:'none',stroke:'var(--no)','stroke-width':1.6,'stroke-dasharray':'4 4','stroke-opacity':.8}));
    const t=mk('text',{class:'elabel',x:mx,y:NY+80,'text-anchor':'middle',fill:'var(--no)','font-family':'var(--mono)','font-size':'9.5'});t.textContent=lab;svg.appendChild(t);});
  // family edge label
  const el2=mk('text',{class:'elabel',x:byId.GSTM5.x,y:NY+42,'text-anchor':'middle',fill:'var(--muted)','font-family':'var(--mono)','font-size':'9.5'});el2.textContent='id ≥ 80% · cov ≥ 50%';svg.appendChild(el2);

  // nodes (step 2+)
  LOCI.forEach(l=>{
    const g=mk('g',{class:'node '+l.kind,transform:`translate(${l.x},${NY})`});
    g.appendChild(mk('circle',{r:15,fill:'var(--spine)','fill-opacity':.9,stroke:'var(--surface)','stroke-width':2}));
    const t=mk('text',{'text-anchor':'middle',y:3.5,fill:'#fff','font-family':'var(--mono)','font-size':'8.5','font-weight':'600'});
    t.textContent=l.label.replace('GSTM','M'); g.appendChild(t);
    const lt=mk('text',{'text-anchor':'middle',y:30,fill:'var(--muted)','font-family':'var(--mono)','font-size':'9'});lt.textContent=l.label;g.appendChild(lt);
    svg.appendChild(g);
  });
}

const CAPS=[
  {h:'Step 1 · Reads',p:'Iso-Seq reads align to the genome and pile up wherever a gene is transcribed. Near-identical paralogs — a tandem array like GSTM3 / GSTM5 / GSTM1 — pile up at adjacent loci; other genes pile up elsewhere. No annotation is used.',n:'the raw material: full-length transcript molecules'},
  {h:'Step 2 · Loci',p:'Reads that share an intron chain collapse into one de-novo locus — a node in the graph. This is where the count first appears: many reads → a handful of loci.',n:'GSTM: <b>2,673 reads → 3 loci</b>. Every expressed locus becomes one node.'},
  {h:'Step 3 · Homology edges',p:'Align every pair of loci and draw an edge only where they are homologous full-length — identity ≥ 80% AND ≥ 50% of the shorter transcript aligns. GSTM3/5/1 all pair up (≈83%). DOM1 and DOM2 share one exon, but only 22% aligns → no edge. A shared domain is not a family.',n:'the edge is a measurement, not a threshold guess: both identity <b>and</b> coverage must hold'},
  {h:'Step 4 · Families',p:'A family is a dense cluster of ≥ 2 loci — a γ-quasi-clique. GSTM3/5/1 form one, so the family is called with χ_H = 3 copies. The domain-sharers and the singleton gene are not families.',n:'1 family found: <b>GSTM (3 copies)</b>. → the γ-quasi-clique step is its own viz.'},
];
let step=0;
function setStep(s){
  step=Math.max(0,Math.min(3,s));
  $('stage').setAttribute('data-step',step);
  document.querySelectorAll('.steps button').forEach(b=>b.classList.toggle('on',+b.dataset.s===step));
  $('dots').innerHTML=[0,1,2,3].map(i=>`<i class="${i===step?'on':''}"></i>`).join('');
  const c=CAPS[step]; $('caption').innerHTML=`<h2>${c.h}</h2><p>${c.p}</p><div class="num">${c.n}</div>`;
  $('prev').disabled=step===0; $('next').disabled=step===3;
}
$('prev').onclick=()=>setStep(step-1);
$('next').onclick=()=>setStep(step+1);
document.querySelectorAll('.steps button').forEach(b=>b.onclick=()=>setStep(+b.dataset.s));
document.addEventListener('keydown',e=>{if(e.key==='ArrowRight')setStep(step+1);if(e.key==='ArrowLeft')setStep(step-1);});
$('foot').innerHTML='No annotation, no reference gene list — the loci, the edges, and the families are all derived from the reads. The dense-cluster step (why γ-quasi-clique, not clique or connected component) has its own interactive.';
$('themebtn').onclick=()=>{const c=document.documentElement.getAttribute('data-theme')||(matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light');document.documentElement.setAttribute('data-theme',c==='dark'?'light':'dark');};

build(); setStep(0);
</script>
